<!DOCTYPE html>
<html>
    <head>
        <title>AlphaNLHoldem - 6-Player No-Limit Texas Hold'em</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.4/css/bulma.min.css">
        <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script type="text/javascript" src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/phaser@3.15.1/dist/phaser-arcade-physics.min.js"></script>
        <script type="text/javascript" src="{{url_for('static', filename='control.js')}}?v={{ range(1, 5000000) | random }}"></script>
    </head>

<body style="background-color: #121212; color: #eee; min-height: 100vh; padding: 20px 0;">
    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <h1 class="title" style="color: #fff; margin-bottom: 12px; font-size: 26px;">AlphaNLHoldem - 6-Player Texas Hold'em</h1>
        <div id="game_container" style="border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.7); background: #1a1a1a;">
        </div>
        <div style="width: 1024px; margin-top: 15px;">
            <h2 class="subtitle" style="color: #aaa; margin-bottom: 6px; font-size: 16px;">Console / Chat</h2>
            <textarea id="chat" style="width: 100%; height: 120px; font-size: 13px; font-family: monospace; background: #1c1c1c; color: #69f0ae; border: 1px solid #333; border-radius: 6px; padding: 8px;" readonly></textarea>
            <div style="display: flex; flex-direction: row; margin-top: 8px;">
                <input type="text" id="textfield_input" style="height: 36px; flex-grow: 1; margin-right: 10px; background: #262626; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 0 12px;" class="textfield" placeholder="Type a message or command ('restart', 'start')...">
                <button id="send_button" class="button is-primary" style="height: 36px; width: 100px; font-weight: bold;">Send</button>
            </div>
        </div>
    </div>
</body>
</html>
